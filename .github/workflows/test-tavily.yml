name: TEST temporal - Tavily desde IP de GitHub Actions

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probar api.tavily.com
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          curl -s -o /tmp/tavily.json -w "status: %{http_code}\n" \
            -X POST "https://api.tavily.com/search" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TAVILY_API_KEY" \
            -d '{"query":"Atletico Nacional Aguilas Doradas 13 septiembre 2026 Liga Betplay hora canal","search_depth":"basic","max_results":5}'
          echo "--- respuesta ---"
          cat /tmp/tavily.json
