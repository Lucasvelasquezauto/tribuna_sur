name: Fetch Colombia (Liga/Copa Betplay)

on:
  schedule:
    - cron: '0 7 * * *' # 02:00 America/Bogota (UTC-5)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Liga/Copa Betplay usan el hub de Dimayor renderizado (Playwright)
      # como fuente principal -- ver CLAUDE.md seccion 13.
      - run: npx playwright install --with-deps chromium
      # continue-on-error en cada paso: si un torneo falla (fuente caida, cuota
      # agotada, etc.) no debe bloquear al otro. Ver CLAUDE.md seccion 10.
      - name: Liga Betplay
        continue-on-error: true
        run: node scripts/fetch-ia.js liga-betplay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Copa Betplay
        continue-on-error: true
        run: node scripts/fetch-ia.js copa-betplay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
