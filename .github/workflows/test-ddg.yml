name: TEST temporal - DuckDuckGo desde IP de GitHub Actions

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probar html.duckduckgo.com
        run: |
          curl -s -o /tmp/ddg.html -w "status: %{http_code}\nbytes: %{size_download}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://html.duckduckgo.com/html/?q=Atletico+Nacional+Aguilas+Doradas+13+septiembre+2026+hora"
          echo "--- primeras 2000 chars ---"
          head -c 2000 /tmp/ddg.html
