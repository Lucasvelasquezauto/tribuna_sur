<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tribuna Sur</title>
  <meta name="description" content="Los partidos de hoy: hora, resultado y canal de TV/streaming en Colombia." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9917;</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="fondo-textura" aria-hidden="true"></div>

  <header class="cabecera">
    <div class="cabecera-marca">
      <h1 class="marca">Tribuna <span>Sur</span></h1>
      <p class="marca-tagline">Quién juega hoy, a qué hora y por dónde verlo</p>
    </div>
    <button id="btn-ajustes" class="btn-icono btn-icono-estrella" aria-label="Torneos y favoritos" title="Torneos y favoritos">
      &#9733;
    </button>
  </header>

  <nav class="controles">
    <div class="selector-fecha">
      <button id="btn-dia-anterior" class="btn-flecha" aria-label="Dia anterior">&#8249;</button>
      <div class="fecha-display">
        <span id="fecha-actual" class="fecha-texto"></span>
        <button id="btn-hoy" class="btn-hoy">Hoy</button>
      </div>
      <button id="btn-dia-siguiente" class="btn-flecha" aria-label="Dia siguiente">&#8250;</button>
      <input type="date" id="fecha-input" class="fecha-input-oculto" aria-label="Elegir fecha" />
    </div>

    <div class="tabs-vista" role="tablist">
      <button class="tab-vista activo" data-vista="todos" role="tab">Todos</button>
      <button class="tab-vista" data-vista="favoritos" role="tab">Mis favoritos</button>
    </div>
  </nav>

  <main id="partidos-contenedor" class="partidos-contenedor" aria-live="polite"></main>

  <div id="overlay-ajustes" class="overlay"></div>

  <aside id="panel-ajustes" class="panel-ajustes" aria-label="Ajustes">
    <div class="panel-header">
      <h2>Ajustes</h2>
      <button id="btn-cerrar-ajustes" class="btn-icono" aria-label="Cerrar ajustes">&times;</button>
    </div>

    <section class="panel-seccion">
      <h3>Torneos activos</h3>
      <div id="torneos-checklist" class="checklist"></div>
    </section>

    <section class="panel-seccion">
      <h3>Equipos favoritos</h3>
      <p class="panel-ayuda">Sigue a un equipo en cualquier torneo en el que juegue, aunque no lo tengas activo arriba.</p>
      <div class="buscador-equipo">
        <input type="text" id="busqueda-equipo" placeholder="Buscar equipo&hellip;" autocomplete="off" />
        <div id="busqueda-resultados" class="busqueda-resultados"></div>
      </div>
      <div id="favoritos-chips" class="favoritos-chips"></div>
    </section>
  </aside>

  <footer class="pie">
    <p>Tribuna Sur &middot; datos automáticos, pueden tener errores puntuales</p>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
